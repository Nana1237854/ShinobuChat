<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShinobuChat Prototype</title>
  <style>
    :root {
      --bg-1: #e7d1b8;
      --bg-2: #f7ede3;
      --bg-3: #c8d7de;
      --ink: #2e2723;
      --muted: #7b6e64;
      --line: rgba(122, 88, 58, 0.18);
      --panel: rgba(255, 250, 243, 0.78);
      --accent: #c25a39;
      --accent-deep: #8d3f2d;
      --conversation-right: 24px;
      --conversation-width: min(388px, calc(100vw - 48px));
      --mint: #dcefe6;
      --mint-ink: #276050;
      --shadow: 0 24px 60px rgba(66, 42, 25, 0.16);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --content-width: min(1240px, calc(100vw - 28px));
      --room-width: var(--content-width);
      --room-height: calc(100vh - 28px);
      --edge-gap: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 24%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .live-room {
      position: relative;
      width: var(--room-width);
      height: var(--room-height);
      overflow: hidden;
      border: 1px solid rgba(128, 98, 72, 0.16);
      border-radius: 34px;
      background:
        linear-gradient(rgba(25, 32, 39, 0.08), rgba(26, 22, 20, 0.22)),
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.88), transparent 22%),
        linear-gradient(120deg, #dbe7ef 0%, #f6efe7 46%, #7f8b92 100%);
      box-shadow: var(--shadow);
    }

    .live-room::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.18;
      pointer-events: none;
    }

    .top-live-bar {
      position: absolute;
      top: var(--edge-gap);
      left: var(--edge-gap);
      right: var(--edge-gap);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 999px;
      background: rgba(255, 249, 241, 0.75);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 40px rgba(61, 44, 31, 0.14);
    }

    .brand {
      padding-left: 8px;
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 252, 247, 0.8);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip.online {
      background: var(--mint);
      color: var(--mint-ink);
    }

    .chip.offline {
      color: var(--accent-deep);
      background: rgba(255, 238, 227, 0.92);
    }

    .chip.queue {
      color: #6f5a47;
      background: rgba(248, 240, 230, 0.92);
    }

    .chip.strong {
      color: var(--accent-deep);
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-btn,
    .send-btn,
    .ghost-btn,
    .route-chip {
      border: 1px solid var(--line);
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .pill-btn:hover,
    .ghost-btn:hover,
    .route-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(194, 90, 57, 0.38);
    }

    .pill-btn,
    .ghost-btn {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(255, 250, 243, 0.84);
      color: var(--ink);
      font-weight: 800;
    }

    .ghost-btn {
      background: transparent;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding-top: clamp(54px, 7.2%, 74px);
      pointer-events: none;
    }

    .avatar {
      position: relative;
      width: clamp(240px, 31%, 380px);
      aspect-ratio: 0.58;
      filter: drop-shadow(0 28px 36px rgba(53, 40, 34, 0.2));
    }

    .hair,
    .body,
    .face,
    .collar,
    .tail-left,
    .tail-right,
    .eye,
    .mouth {
      position: absolute;
    }

    .hair {
      left: 12%;
      top: 8%;
      width: 76%;
      height: 42%;
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(135deg, #fff7fb, #dac8cf 72%, #baa2aa);
    }

    .face {
      z-index: 2;
      left: 27%;
      top: 22%;
      width: 46%;
      height: 31%;
      border-radius: 46% 46% 48% 48%;
      background: linear-gradient(#fff0e9, #edd4ce);
      border: 1px solid rgba(127, 91, 87, 0.14);
    }

    .eye {
      top: 43%;
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 48% 42%, #edf9ff 0 12%, #75b4e7 14% 38%, #4758be 42% 64%, #252a64 68%);
      box-shadow: 0 0 0 4px rgba(55, 64, 108, 0.12);
    }

    .eye.left { left: 25%; }
    .eye.right { right: 25%; }

    .mouth {
      left: 45%;
      top: 73%;
      width: 10%;
      height: 4%;
      border-bottom: 3px solid rgba(96, 58, 57, 0.52);
      border-radius: 50%;
    }

    .body {
      left: 21%;
      bottom: 0;
      width: 58%;
      height: 52%;
      border-radius: 42% 42% 10% 10%;
      background: linear-gradient(90deg, #d9edf6, #fbf5ee 44%, #c5d7e2);
      border: 1px solid rgba(74, 88, 99, 0.12);
    }

    .collar {
      z-index: 3;
      left: 36%;
      top: 50%;
      width: 28%;
      height: 9%;
      border-radius: 50%;
      background: #58515b;
    }

    .tail-left,
    .tail-right {
      top: 14%;
      width: 18%;
      height: 54%;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(#fff8fb, #ccb7bf);
    }

    .tail-left {
      left: 3%;
      transform: rotate(18deg);
    }

    .tail-right {
      right: 3%;
      transform: rotate(-18deg);
    }

    .chat-dock {
      position: absolute;
      left: calc(var(--edge-gap) + 6px);
      bottom: clamp(104px, 12%, 128px);
      z-index: 6;
      width: clamp(280px, calc(46% - var(--edge-gap)), 520px);
      display: grid;
      gap: 12px;
      align-content: end;
    }

    .bubble,
    .history-bubble,
    .streaming-badge,
    .meta-card {
      box-shadow: 0 14px 34px rgba(51, 39, 31, 0.12);
    }

    .bubble {
      width: fit-content;
      max-width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      line-height: 1.58;
      font-size: 15px;
      font-weight: 620;
    }

    .bubble.user {
      justify-self: end;
      color: #fff8ef;
      background: linear-gradient(135deg, var(--accent), #b84a29);
    }

    .bubble.shinobu {
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 250, 244, 0.9);
      backdrop-filter: blur(16px);
    }

    .bubble.empty {
      max-width: 420px;
      border: 1px dashed rgba(141, 63, 45, 0.2);
      color: var(--muted);
      background: rgba(255, 250, 244, 0.5);
    }

    .message-body {
      display: grid;
      gap: 8px;
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .message-badge,
    .message-sync {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.02em;
    }

    .message-badge {
      border: 1px solid rgba(122, 88, 58, 0.16);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.62);
    }

    .message-badge.companion {
      color: var(--mint-ink);
      background: rgba(220, 239, 230, 0.92);
    }

    .message-badge.task {
      color: #fff8ef;
      background: linear-gradient(135deg, var(--accent), #b84a29);
      border-color: transparent;
    }

    .message-sync {
      border: 1px solid rgba(122, 88, 58, 0.14);
      color: var(--muted);
      background: rgba(248, 242, 235, 0.92);
    }

    .message-sync.pending,
    .message-sync.sending {
      color: #8d5a33;
      background: rgba(255, 241, 218, 0.95);
    }

    .message-sync.failed {
      color: #8f3d29;
      background: rgba(255, 229, 220, 0.96);
    }

    .message-copy {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .streaming-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      color: var(--accent-deep);
      background: rgba(255, 249, 241, 0.82);
      font-size: 13px;
      font-weight: 800;
    }

    .streaming-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes ambientBreath {
      0%, 100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 14px 32px rgba(57, 42, 31, 0.12);
      }
      50% {
        transform: translateY(-2px) scale(1.012);
        box-shadow: 0 18px 38px rgba(57, 42, 31, 0.16);
      }
    }

    .conversation-toggle {
      position: absolute;
      right: calc(var(--conversation-right) + var(--conversation-width) - 18px);
      top: 50%;
      z-index: 8;
      width: 42px;
      height: 92px;
      border: 0;
      border-radius: 14px 0 0 14px;
      background: rgba(255, 248, 239, 0.96);
      color: var(--accent-deep);
      font-size: 26px;
      font-weight: 900;
      box-shadow: -10px 12px 28px rgba(64, 40, 22, 0.16);
      transform: translateY(-50%);
      transition: transform 0.18s ease, background 0.16s ease, color 0.16s ease;
    }

    .conversation-panel {
      position: absolute;
      top: calc(var(--edge-gap) + 54px);
      right: var(--conversation-right);
      bottom: var(--edge-gap);
      z-index: 7;
      width: var(--conversation-width);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: var(--radius-lg);
      background: rgba(255, 250, 243, 0.82);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(51, 39, 31, 0.16);
      transform: translateX(calc(100% + 20px));
      opacity: 0;
      pointer-events: none;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .live-room.conversation-open .conversation-panel {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .live-room.conversation-open .conversation-toggle {
      right: calc(var(--conversation-right) + var(--conversation-width) - 18px);
      transform: translateY(-50%) scaleX(-1);
    }

    .conversation-toggle:hover {
      background: var(--accent);
      color: #fff8ef;
    }

    .live-room.idle-ui:not(.conversation-open) .conversation-toggle {
      animation: ambientBreath 3.4s ease-in-out infinite;
    }

    .live-room.idle-ui:not(.conversation-open) .conversation-toggle:hover,
    .live-room.idle-ui:not(.conversation-open) .conversation-toggle:focus-visible {
      animation: none;
    }

    .status-orb {
      position: absolute;
      right: var(--edge-gap);
      bottom: max(16px, calc(var(--edge-gap) - 4px));
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 250, 243, 0.84);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 32px rgba(57, 42, 31, 0.12);
      font-size: 13px;
      font-weight: 780;
    }

    .status-orb strong {
      color: var(--accent-deep);
    }

    .live-room.conversation-open .status-orb {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    .live-room.idle-ui:not(.conversation-open) .status-orb {
      animation: ambientBreath 3.8s ease-in-out infinite;
    }

    .live-room.idle-ui:not(.conversation-open) .status-orb:hover,
    .live-room.idle-ui:not(.conversation-open) .status-orb:focus-visible {
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .live-room.idle-ui .conversation-toggle,
      .live-room.idle-ui .status-orb {
        animation: none;
      }
    }

    .conversation-head,
    .composer-head,
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .meta-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255, 252, 247, 0.8);
    }

    .meta-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .meta-row strong {
      color: var(--ink);
      font-weight: 800;
    }

    .history-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 10px;
      padding-right: 4px;
      align-content: start;
    }

    .history-bubble {
      max-width: 88%;
      padding: 13px 15px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.56;
      font-weight: 620;
    }

    .history-bubble.user {
      justify-self: end;
      color: #fff8ef;
      background: linear-gradient(135deg, var(--accent), #b84a29);
    }

    .history-bubble.assistant {
      border: 1px solid var(--line);
      background: rgba(255, 252, 247, 0.84);
    }

    .history-bubble .message-meta {
      margin-bottom: 2px;
    }

    .conversation-composer,
    .input-bar {
      border: 1px solid rgba(255, 255, 255, 0.56);
      background: rgba(255, 250, 243, 0.8);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 40px rgba(57, 42, 31, 0.14);
    }

    .conversation-composer {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
    }

    .route-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .route-chip {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .route-chip.active {
      color: #fff8ef;
      background: var(--accent);
      border-color: transparent;
    }

    .route-hint,
    .status-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 720;
    }

    .conversation-textarea,
    .message-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
    }

    .conversation-textarea:focus,
    .message-input:focus {
      border-color: rgba(194, 90, 57, 0.44);
      box-shadow: 0 0 0 3px rgba(194, 90, 57, 0.08);
    }

    .conversation-textarea {
      min-height: 92px;
      padding: 13px 14px;
      resize: vertical;
      line-height: 1.56;
    }

    .input-bar {
      position: absolute;
      left: 50%;
      bottom: max(16px, calc(var(--edge-gap) - 4px));
      z-index: 8;
      width: clamp(420px, calc(100% - (var(--edge-gap) * 2) - 220px), 760px);
      transform: translateX(-50%);
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: 28px;
    }

    .input-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 98px;
      gap: 10px;
      align-items: center;
    }

    .message-input {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 650;
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .send-btn {
      min-height: 48px;
      border-radius: 999px;
      border-color: transparent;
      color: #fffaf4;
      background: var(--accent);
      font-weight: 900;
    }

    .send-btn:disabled,
    .pill-btn:disabled,
    .ghost-btn:disabled,
    .message-input:disabled,
    .conversation-textarea:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .toast-stack {
      position: absolute;
      top: calc(var(--edge-gap) + 78px);
      right: calc(var(--edge-gap) + 4px);
      z-index: 12;
      width: min(320px, calc(100% - (var(--edge-gap) * 2)));
      display: grid;
      gap: 10px;
      pointer-events: none;
    }

    .live-room.layout-compact {
      --edge-gap: 18px;
    }

    .live-room.layout-compact .top-live-bar {
      padding: 8px 10px;
    }

    .live-room.layout-compact .chat-dock {
      width: clamp(260px, calc(44% - var(--edge-gap)), 440px);
      bottom: clamp(98px, 11%, 118px);
    }

    .live-room.layout-compact .avatar {
      width: clamp(220px, 29%, 332px);
    }

    .live-room.layout-compact .input-bar {
      width: clamp(400px, calc(100% - (var(--edge-gap) * 2) - 170px), 700px);
    }

    .live-room.layout-tight {
      --edge-gap: 14px;
    }

    .live-room.layout-tight .top-live-bar {
      gap: 8px;
      padding: 8px 10px;
    }

    .live-room.layout-tight .chip,
    .live-room.layout-tight .pill-btn,
    .live-room.layout-tight .ghost-btn {
      min-height: 32px;
      padding: 0 12px;
      font-size: 12px;
    }

    .live-room.layout-tight .chat-dock {
      width: clamp(240px, calc(42% - var(--edge-gap)), 360px);
      gap: 10px;
      bottom: 92px;
    }

    .live-room.layout-tight .bubble {
      padding: 12px 14px;
      font-size: 14px;
    }

    .live-room.layout-tight .avatar {
      width: clamp(200px, 28%, 288px);
    }

    .live-room.layout-tight .input-bar {
      width: clamp(360px, calc(100% - (var(--edge-gap) * 2) - 132px), 620px);
      padding: 10px;
    }

    .live-room.layout-tight .message-input,
    .live-room.layout-tight .send-btn {
      min-height: 44px;
    }

    .toast {
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 14px;
      background: rgba(255, 250, 243, 0.92);
      box-shadow: 0 16px 38px rgba(49, 37, 29, 0.14);
      font-size: 13px;
      font-weight: 760;
      line-height: 1.45;
    }

    @media (max-width: 1080px) {
      .conversation-toggle {
        right: 24px;
        top: auto;
        bottom: 340px;
        height: 56px;
        width: 56px;
        border-radius: 50%;
        transform: none;
      }

      .live-room.conversation-open .conversation-toggle {
        right: 24px;
      }

      .conversation-panel {
        left: 14px;
        right: 14px;
        top: 86px;
        bottom: 122px;
        width: auto;
      }

      .status-orb {
        right: 16px;
        bottom: 12px;
      }

      .chat-dock {
        right: 18px;
        width: auto;
      }
    }

    @media (max-width: 760px) {
      .app-shell {
        padding: 0;
      }

      .live-room {
        width: 100vw;
        min-height: 100vh;
        border-radius: 0;
      }

      .top-live-bar {
        left: 12px;
        right: 12px;
        top: 12px;
        flex-wrap: wrap;
        border-radius: 24px;
      }

      .brand,
      .top-actions {
        width: 100%;
      }

      .top-actions {
        margin-left: 0;
        justify-content: space-between;
      }

      .chat-dock {
        left: 14px;
        right: 14px;
        bottom: 164px;

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script>
    const apiBase = "/api/v1";
    const sqlJsCdnRoot = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3";
    const RouteModeValue = {
      AUTO: "auto",
      CHAT: "chat",
      AGENT: "agent"
    };

    const storageKeys = {
      demoUser: "shinobu-demo-user",
      conversationId: "shinobu-conversation-id",
      conversationKey: "shinobu-conversation-key",
      routeMode: "shinobu-route-mode",
      fallbackMessages: "shinobu-cache-fallback-messages",
      fallbackPending: "shinobu-cache-fallback-pending"
    };

    const routeModeConfig = {
      auto: {
        label: "自动决策",
        hint: "自动识别陪伴/任务意图；离线时先本地保存并排队同步。"
      },
      chat: {
        label: "纯聊天",
        hint: "纯聊天：消息标记为 companion，并优先保持轻量对话。"
      },
      agent: {
        label: "强制 Agent",
        hint: "强制 Agent：消息标记为 task，并按任务处理口径组织回复。"
      }
    };

    const taskKeywords = ["帮我", "安排", "提醒", "创建", "记录", "总结", "生成", "计划", "todo", "待办", "任务", "同步"];
    const messageCategoryLabels = { companion: "Companion", task: "Task" };
    const syncStatusLabels = { pending: "待同步", sending: "同步中", failed: "同步失败" };

    const state = {
      userId: null,
      conversationId: localStorage.getItem(storageKeys.conversationId),
      conversationKey: localStorage.getItem(storageKeys.conversationKey) || null,
      routeMode: localStorage.getItem(storageKeys.routeMode) || RouteModeValue.AUTO,
      messages: [],
      pendingQueueCount: 0,
      isFlushing: false,
      pendingAssistant: null,
      cacheMode: "loading",
      lastError: null,
      bootstrapComplete: false
    };

    if (!state.conversationKey && state.conversationId) {
      state.conversationKey = `server:${state.conversationId}`;
    }

    const liveRoom = document.getElementById("liveRoom");
    const chatDock = document.getElementById("chatDock");
    const historyList = document.getElementById("historyList");
    const conversationToggle = document.getElementById("conversationToggle");
    const openConversationBtn = document.getElementById("openConversationBtn");
    const modeChip = document.getElementById("modeChip");
    const routeHint = document.getElementById("routeHint");
    const panelRouteHint = document.getElementById("panelRouteHint");
    const conversationMeta = document.getElementById("conversationMeta");
    const panelConversationMeta = document.getElementById("panelConversationMeta");
    const routeModeMeta = document.getElementById("routeModeMeta");
    const conversationModeMeta = document.getElementById("conversationModeMeta");
    const messageCountMeta = document.getElementById("messageCountMeta");
    const historyStateChip = document.getElementById("historyStateChip");
    const connectionChip = document.getElementById("connectionChip");
    const streamStatus = document.getElementById("streamStatus");
    const streamingBadge = document.getElementById("streamingBadge");
    const toastStack = document.getElementById("toastStack");
    const messageInput = document.getElementById("messageInput");
    const panelMessageInput = document.getElementById("panelMessageInput");
    const panelSendBtn = document.getElementById("panelSendBtn");
    const newConversationBtn = document.getElementById("newConversationBtn");
    const composerForm = document.getElementById("composerForm");
    const statusOrb = document.getElementById("statusOrb");

    const cacheAdapter = {
      storageMode: "loading",
      SQL: null,
      db: null,
      fallback: {
        messages: [],
        pending: []
      },

      async init() {
        try {
          if (typeof window.initSqlJs !== "function") {
            throw new Error("sql.js unavailable");
          }
          this.SQL = await window.initSqlJs({
            locateFile: (file) => `${sqlJsCdnRoot}/${file}`
          });
          await this.load();
          this.storageMode = "sqlite";
        } catch (error) {
          console.warn("SQLite cache unavailable, fallback to localStorage.", error);
          this.storageMode = "fallback";
          this.loadFallback();
          this.ensureSchema();
          await this.save();
        }
        return this.storageMode;
      },

      async load() {
        const bytes = await this.loadDatabaseBytes();
        this.db = bytes ? new this.SQL.Database(bytes) : new this.SQL.Database();
        this.ensureSchema();
      },

      ensureSchema() {
        if (this.storageMode === "fallback") {
          this.fallback.messages = Array.isArray(this.fallback.messages) ? this.fallback.messages : [];
          this.fallback.pending = Array.isArray(this.fallback.pending) ? this.fallback.pending : [];
          return;
        }

        this.db.run(`
          CREATE TABLE IF NOT EXISTS messages (
            local_id INTEGER PRIMARY KEY,
            client_message_id TEXT UNIQUE NOT NULL,
            server_message_id TEXT NULL,
            conversation_key TEXT NOT NULL,
            conversation_id TEXT NULL,
            user_id TEXT NOT NULL,
            role TEXT NOT NULL,
            content TEXT NOT NULL,
            route_mode TEXT NOT NULL,
            message_category TEXT NOT NULL,
            sync_status TEXT NOT NULL,
            error_message TEXT NULL,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          CREATE TABLE IF NOT EXISTS pending_sync (
            client_message_id TEXT PRIMARY KEY,
            conversation_key TEXT NOT NULL,
            payload_json TEXT NOT NULL,
            attempt_count INTEGER NOT NULL DEFAULT 0,
            last_error TEXT NULL,
            next_retry_at TEXT NULL,
            created_at TEXT NOT NULL,
            updated_at TEXT NOT NULL
          );

          CREATE INDEX IF NOT EXISTS idx_messages_conversation_key ON messages (conversation_key);
          CREATE INDEX IF NOT EXISTS idx_messages_created_at ON messages (created_at);
          CREATE INDEX IF NOT EXISTS idx_pending_sync_created_at ON pending_sync (created_at);
        `);
      },

      async save() {
        if (this.storageMode === "fallback") {
          localStorage.setItem(storageKeys.fallbackMessages, JSON.stringify(this.fallback.messages));
          localStorage.setItem(storageKeys.fallbackPending, JSON.stringify(this.fallback.pending));
          return;
        }

        const bytes = this.db.export();
        await this.saveDatabaseBytes(bytes);
      },

      loadFallback() {
        try {
          this.fallback.messages = JSON.parse(localStorage.getItem(storageKeys.fallbackMessages) || "[]");
        } catch (error) {
          this.fallback.messages = [];
        }

        try {
          this.fallback.pending = JSON.parse(localStorage.getItem(storageKeys.fallbackPending) || "[]");
        } catch (error) {
          this.fallback.pending = [];
        }
      },

      async listMessages(conversationKey = null) {
        if (this.storageMode === "fallback") {
          const items = conversationKey
            ? this.fallback.messages.filter((message) => message.conversation_key === conversationKey)
            : this.fallback.messages.slice();
          return items.map(normalizeMessageRecord).sort(compareMessages);
        }

        const rows = conversationKey
          ? this.queryAll(
              `SELECT * FROM messages WHERE conversation_key = ? ORDER BY datetime(created_at) ASC, local_id ASC`,
              [conversationKey]
            )
          : this.queryAll(`SELECT * FROM messages ORDER BY datetime(created_at) ASC, local_id ASC`);
        return rows.map(normalizeMessageRecord);
      },

      async getLatestConversationKey() {
        if (this.storageMode === "fallback") {
          const latest = this.fallback.messages.slice().sort(compareMessages).pop();
          return latest ? latest.conversation_key : null;
        }

        const rows = this.queryAll(
          `SELECT conversation_key FROM messages ORDER BY datetime(created_at) DESC, local_id DESC LIMIT 1`
        );
        return rows.length ? String(rows[0].conversation_key) : null;
      },

      async findMessage(clientMessageId) {
        const key = String(clientMessageId);
        if (this.storageMode === "fallback") {
          const match = this.fallback.messages.find((message) => String(message.client_message_id) === key);
          return match ? normalizeMessageRecord(match) : null;
        }

        const rows = this.queryAll(`SELECT * FROM messages WHERE client_message_id = ? LIMIT 1`, [key]);
        return rows.length ? normalizeMessageRecord(rows[0]) : null;
      },

      async upsertMessage(message) {
        const record = normalizeMessageRecord(message);
        if (this.storageMode === "fallback") {
          const index = this.fallback.messages.findIndex(
            (item) => String(item.client_message_id) === String(record.client_message_id)
          );
          if (index === -1) {
            this.fallback.messages.push(record);
          } else {
            this.fallback.messages[index] = { ...this.fallback.messages[index], ...record };
          }
          this.fallback.messages.sort(compareMessages);
          await this.save();
          return record;
        }

        this.db.run(
          `
            INSERT INTO messages (
              client_message_id,
              server_message_id,
              conversation_key,
              conversation_id,
              user_id,
              role,
              content,
              route_mode,
              message_category,
              sync_status,
              error_message,
              created_at,
              updated_at
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
            ON CONFLICT(client_message_id) DO UPDATE SET
              server_message_id = excluded.server_message_id,
              conversation_key = excluded.conversation_key,
              conversation_id = excluded.conversation_id,
              user_id = excluded.user_id,
              role = excluded.role,
              content = excluded.content,
              route_mode = excluded.route_mode,
              message_category = excluded.message_category,
              sync_status = excluded.sync_status,
              error_message = excluded.error_message,
              created_at = excluded.created_at,
              updated_at = excluded.updated_at
          `,
          [
            record.client_message_id,
            record.server_message_id,
            record.conversation_key,
            record.conversation_id,
            record.user_id,
            record.role,
            record.content,
            record.route_mode,
            record.message_category,
            record.sync_status,
            record.error_message,
            record.created_at,
            record.updated_at
          ]
        );
        await this.save();
        return record;
      },

      async enqueuePending(entry) {
        const normalized = normalizePendingEntry(entry);
        if (this.storageMode === "fallback") {
          const index = this.fallback.pending.findIndex(
            (item) => String(item.client_message_id) === String(normalized.client_message_id)
          );
          if (index === -1) {
            this.fallback.pending.push(normalized);
          } else {
            this.fallback.pending[index] = { ...this.fallback.pending[index], ...normalized };
          }
          this.fallback.pending.sort(comparePendingEntries);
          await this.save();
          return normalized;
        }

        this.db.run(
          `
            INSERT INTO pending_sync (
              client_message_id,
              conversation_key,
              payload_json,
              attempt_count,
              last_error,
              next_retry_at,
              created_at,
              updated_at
            ) VALUES (?, ?, ?, ?, ?, ?, ?, ?)
            ON CONFLICT(client_message_id) DO UPDATE SET
              conversation_key = excluded.conversation_key,
              payload_json = excluded.payload_json,
              attempt_count = excluded.attempt_count,
              last_error = excluded.last_error,
              next_retry_at = excluded.next_retry_at,
              created_at = excluded.created_at,
              updated_at = excluded.updated_at
          `,
          [
            normalized.client_message_id,
            normalized.conversation_key,
            normalized.payload_json,
            normalized.attempt_count,
            normalized.last_error,
            normalized.next_retry_at,
            normalized.created_at,
            normalized.updated_at
          ]
        );
        await this.save();
        return normalized;
      },

      async dequeuePending(clientMessageId) {
        const key = String(clientMessageId);
        if (this.storageMode === "fallback") {
          this.fallback.pending = this.fallback.pending.filter(
            (item) => String(item.client_message_id) !== key
          );
          await this.save();
          return;
        }

        this.db.run(`DELETE FROM pending_sync WHERE client_message_id = ?`, [key]);
        await this.save();
      },

      async listPendingSync() {
        if (this.storageMode === "fallback") {
          return this.fallback.pending.slice().sort(comparePendingEntries).map(normalizePendingEntry);
        }

        const rows = this.queryAll(
          `SELECT * FROM pending_sync ORDER BY datetime(created_at) ASC, client_message_id ASC`
        );
        return rows.map(normalizePendingEntry);
      },

      async getPendingCount() {
        const rows = await this.listPendingSync();
        return rows.length;
      },

      async promoteConversationKey(sourceConversationKey, targetConversationKey, conversationId) {
        if (!sourceConversationKey) {
          return;
        }

        if (this.storageMode === "fallback") {
          this.fallback.messages = this.fallback.messages.map((message) => {
            if (message.conversation_key !== sourceConversationKey) {
              return message;
            }
            return normalizeMessageRecord({
              ...message,
              conversation_key: targetConversationKey,
              conversation_id: conversationId,
              updated_at: nowIso()
            });
          });
          this.fallback.pending = this.fallback.pending.map((entry) => {
            if (entry.conversation_key !== sourceConversationKey) {
              return entry;
            }
            const payload = JSON.parse(entry.payload_json);
            payload.conversation_id = conversationId;
            return normalizePendingEntry({
              ...entry,
              conversation_key: targetConversationKey,
              payload_json: JSON.stringify(payload),
              updated_at: nowIso()
            });
          });
          await this.save();
          return;
        }

        this.db.run(
          `UPDATE messages SET conversation_key = ?, conversation_id = ?, updated_at = ? WHERE conversation_key = ?`,
          [targetConversationKey, conversationId, nowIso(), sourceConversationKey]
        );

        const pendingRows = this.queryAll(`SELECT * FROM pending_sync WHERE conversation_key = ?`, [sourceConversationKey]);
        pendingRows.forEach((row) => {
          const payload = JSON.parse(String(row.payload_json));
          payload.conversation_id = conversationId;
          this.db.run(
            `UPDATE pending_sync SET conversation_key = ?, payload_json = ?, updated_at = ? WHERE client_message_id = ?`,
            [targetConversationKey, JSON.stringify(payload), nowIso(), row.client_message_id]
          );
        });
        await this.save();
      },

      async rebindConversationKey(sourceConversationKey, targetConversationKey) {
        if (!sourceConversationKey || sourceConversationKey === targetConversationKey) {
          return;
        }

        if (this.storageMode === "fallback") {
          this.fallback.messages = this.fallback.messages.map((message) => {
            if (message.conversation_key !== sourceConversationKey) {
              return message;
            }
            return normalizeMessageRecord({
              ...message,
              conversation_key: targetConversationKey,
              conversation_id: null,
              updated_at: nowIso()
            });
          });
          this.fallback.pending = this.fallback.pending.map((entry) => {
            if (entry.conversation_key !== sourceConversationKey) {
              return entry;
            }
            const payload = JSON.parse(entry.payload_json);
            payload.conversation_id = null;
            return normalizePendingEntry({
              ...entry,
              conversation_key: targetConversationKey,
              payload_json: JSON.stringify(payload),
              last_error: null,
              next_retry_at: null,
              updated_at: nowIso()
            });
          });
          await this.save();
          return;
        }

        this.db.run(
          `UPDATE messages SET conversation_key = ?, conversation_id = NULL, updated_at = ? WHERE conversation_key = ?`,
          [targetConversationKey, nowIso(), sourceConversationKey]
        );

        const pendingRows = this.queryAll(`SELECT * FROM pending_sync WHERE conversation_key = ?`, [sourceConversationKey]);
        pendingRows.forEach((row) => {
          const payload = JSON.parse(String(row.payload_json));
          payload.conversation_id = null;
          this.db.run(
            `UPDATE pending_sync SET conversation_key = ?, payload_json = ?, last_error = NULL, next_retry_at = NULL, updated_at = ? WHERE client_message_id = ?`,
            [targetConversationKey, JSON.stringify(payload), nowIso(), row.client_message_id]
          );
        });
        await this.save();
      },

      async flushQueue(handler) {
        const pending = await this.listPendingSync();
        for (const item of pending) {
          const shouldContinue = await handler(item);
          if (shouldContinue === false) {
            break;
          }
        }
      },

      queryAll(sql, params = []) {
        const statement = this.db.prepare(sql, params);
        const rows = [];
        while (statement.step()) {
          rows.push(statement.getAsObject());
        }
        statement.free();
        return rows;
      },

      async loadDatabaseBytes() {
        const db = await this.openIndexedDb();
        return await new Promise((resolve, reject) => {
          const transaction = db.transaction("files", "readonly");
          const store = transaction.objectStore("files");
          const request = store.get("sqlite-cache");
          request.onsuccess = () => resolve(request.result || null);
          request.onerror = () => reject(request.error || new Error("IndexedDB read failed"));
        });
      },

      async saveDatabaseBytes(bytes) {
        const db = await this.openIndexedDb();
        await new Promise((resolve, reject) => {
          const transaction = db.transaction("files", "readwrite");
          const store = transaction.objectStore("files");
          const request = store.put(bytes, "sqlite-cache");
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error("IndexedDB write failed"));
        });
      },

      async openIndexedDb() {
        return await new Promise((resolve, reject) => {
          const request = indexedDB.open("shinobu-sqlite-cache", 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains("files")) {
              db.createObjectStore("files");
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("IndexedDB open failed"));
        });
      }
    };

    function nowIso() {
      return new Date().toISOString();
    }

    function normalizeIso(value) {
      return value ? new Date(value).toISOString() : nowIso();
    }

    function compareMessages(left, right) {
      const leftTime = new Date(left.created_at).getTime();
      const rightTime = new Date(right.created_at).getTime();
      if (leftTime !== rightTime) {
        return leftTime - rightTime;
      }
      return getMessageIdentity(left).localeCompare(getMessageIdentity(right));
    }

    function comparePendingEntries(left, right) {
      const leftTime = new Date(left.created_at).getTime();
      const rightTime = new Date(right.created_at).getTime();
      if (leftTime !== rightTime) {
        return leftTime - rightTime;
      }
      return String(left.client_message_id).localeCompare(String(right.client_message_id));
    }

    function normalizeMessageRecord(record) {
      return {
        id: record.id ? String(record.id) : null,
        client_message_id: String(record.client_message_id || record.id || crypto.randomUUID()),
        server_message_id: record.server_message_id ? String(record.server_message_id) : (record.id ? String(record.id) : null),
        conversation_key: String(record.conversation_key || state.conversationKey || `local:${crypto.randomUUID()}`),
        conversation_id: record.conversation_id ? String(record.conversation_id) : null,
        user_id: String(record.user_id || state.userId || ""),
        role: String(record.role || "assistant"),
        content: String(record.content || ""),
        route_mode: String(record.route_mode || RouteModeValue.AUTO),
        message_category: String(record.message_category || "companion"),
        sync_status: String(record.sync_status || "synced"),
        error_message: record.error_message ? String(record.error_message) : null,
        created_at: normalizeIso(record.created_at),
        updated_at: normalizeIso(record.updated_at || record.created_at),
        ephemeral: Boolean(record.ephemeral),
        source_client_message_id: record.source_client_message_id ? String(record.source_client_message_id) : null
      };
    }

    function normalizePendingEntry(entry) {
      return {
        client_message_id: String(entry.client_message_id),
        conversation_key: String(entry.conversation_key),
        payload_json: typeof entry.payload_json === "string" ? entry.payload_json : JSON.stringify(entry.payload_json),
        attempt_count: Number(entry.attempt_count || 0),
        last_error: entry.last_error ? String(entry.last_error) : null,
        next_retry_at: entry.next_retry_at ? normalizeIso(entry.next_retry_at) : null,
        created_at: normalizeIso(entry.created_at),
        updated_at: normalizeIso(entry.updated_at || entry.created_at)
      };
    }

    function getMessageIdentity(message) {
      return String(message.client_message_id || message.id || "");
    }

    function isContextActive(conversationKey) {
      return Boolean(state.conversationKey && state.conversationKey === conversationKey);
    }

    function isClientMessageVisible(clientMessageId) {
      return state.messages.some((message) => getMessageIdentity(message) === String(clientMessageId));
    }

    function rebindConversationState(sourceConversationKey, targetConversationKey) {
      if (!sourceConversationKey || sourceConversationKey === targetConversationKey) {
        return;
      }

      state.messages = state.messages.map((message) => {
        if (message.conversation_key !== sourceConversationKey) {
          return message;
        }
        return normalizeMessageRecord({
          ...message,
          conversation_key: targetConversationKey,
          conversation_id: null,
          updated_at: nowIso()
        });
      });
      state.messages.sort(compareMessages);

      if (state.conversationKey === sourceConversationKey) {
        state.conversationKey = targetConversationKey;
        state.conversationId = null;
      }
    }

    function getCurrentConversationText() {
      if (state.conversationId) {
        return `conversation_id: ${state.conversationId}`;
      }
      if (state.conversationKey) {
        return "conversation_id: 待服务端分配";
      }
      return "conversation_id: 未创建";
    }

    function buildConversationKey() {
      return `local:${crypto.randomUUID()}`;
    }

    function buildPendingPayload(message) {
      return {
        client_message_id: message.client_message_id,
        user_id: message.user_id,
        content: message.content,
        conversation_id: message.conversation_id,
        route_mode: message.route_mode,
        message_category: message.message_category
      };
    }

    function classifyMessageCategory(content, routeMode) {
      if (routeMode === RouteModeValue.CHAT) {
        return "companion";
      }
      if (routeMode === RouteModeValue.AGENT) {
        return "task";
      }

      const normalized = content.toLowerCase();
      return taskKeywords.some((keyword) => normalized.includes(keyword.toLowerCase())) ? "task" : "companion";
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      toastStack.prepend(toast);
      window.setTimeout(() => toast.remove(), 2600);
    }

    function setConversationPanelOpen(isOpen) {
      liveRoom.classList.toggle("conversation-open", isOpen);
      conversationToggle.setAttribute("aria-expanded", String(isOpen));
      conversationToggle.textContent = isOpen ? "›" : "‹";
      openConversationBtn.textContent = isOpen ? "收起会话" : "展开会话";
    }

    function syncIdleUiState() {
      liveRoom.classList.toggle("idle-ui", !state.isFlushing && !state.pendingAssistant);
    }

    function applyResponsiveLayout() {
      if (window.innerWidth <= 760) {
        liveRoom.style.removeProperty("--room-width");
        liveRoom.style.removeProperty("--room-height");
        liveRoom.style.removeProperty("--edge-gap");
        liveRoom.style.removeProperty("--conversation-right");
        liveRoom.classList.remove("layout-compact", "layout-tight");
        return;
      }

      const shellPadding = window.innerWidth <= 1080 ? 24 : 28;
      const maxWidth = Math.min(1240, window.innerWidth - shellPadding);
      const maxHeight = Math.min(980, window.innerHeight - shellPadding);
      const roomRatio = 1.22;

      let roomWidth = Math.min(maxWidth, maxHeight * roomRatio);
      let roomHeight = roomWidth / roomRatio;

      if (roomHeight > maxHeight) {
        roomHeight = maxHeight;
        roomWidth = roomHeight * roomRatio;
      }

      const edgeGap =
        roomWidth < 980 || roomHeight < 720 ? 14 :
        roomWidth < 1140 || roomHeight < 820 ? 18 : 22;

      liveRoom.style.setProperty("--room-width", `${Math.round(roomWidth)}px`);
      liveRoom.style.setProperty("--room-height", `${Math.round(roomHeight)}px`);
      liveRoom.style.setProperty("--edge-gap", `${edgeGap}px`);
      liveRoom.style.setProperty("--conversation-right", `${edgeGap}px`);
      liveRoom.classList.toggle("layout-compact", roomWidth < 1140 || roomHeight < 820);
      liveRoom.classList.toggle("layout-tight", roomWidth < 980 || roomHeight < 720);
    }

    function updateRouteMode(nextMode) {
      state.routeMode = nextMode;
      localStorage.setItem(storageKeys.routeMode, nextMode);
      const config = routeModeConfig[nextMode];
      modeChip.textContent = config.label;
      routeModeMeta.textContent = config.label;
      routeHint.textContent = config.hint;
      panelRouteHint.textContent = config.hint;
      document.querySelectorAll("[data-route-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.routeMode === nextMode);
      });
    }

    function syncConversationStorage() {
      if (state.conversationId) {
        localStorage.setItem(storageKeys.conversationId, state.conversationId);
      } else {
        localStorage.removeItem(storageKeys.conversationId);
      }

      if (state.conversationKey) {
        localStorage.setItem(storageKeys.conversationKey, state.conversationKey);
      } else {
        localStorage.removeItem(storageKeys.conversationKey);
      }
    }

    function updateConversationMeta() {
      conversationMeta.textContent = getCurrentConversationText();
      panelConversationMeta.textContent = state.conversationId || (state.conversationKey ? "等待服务端分配" : "未创建 conversation_id");
      if (state.conversationId) {
        conversationModeMeta.textContent = "多轮上下文中";
      } else if (state.conversationKey) {
        conversationModeMeta.textContent = "本地会话待同步";
      } else {
        conversationModeMeta.textContent = "单轮待开始";
      }
      messageCountMeta.textContent = String(state.messages.filter((message) => !message.ephemeral).length);
      syncConversationStorage();
    }

    function createMessageBody(message) {
      const body = document.createElement("div");
      body.className = "message-body";

      const meta = document.createElement("div");
      meta.className = "message-meta";

      if (message.message_category) {
        const categoryBadge = document.createElement("span");
        categoryBadge.className = `message-badge ${message.message_category}`;
        categoryBadge.textContent = messageCategoryLabels[message.message_category] || message.message_category;
        meta.appendChild(categoryBadge);
      }

      if (message.sync_status && message.sync_status !== "synced") {
        const syncBadge = document.createElement("span");
        syncBadge.className = `message-sync ${message.sync_status}`;
        syncBadge.textContent = syncStatusLabels[message.sync_status] || message.sync_status;
        meta.appendChild(syncBadge);
      }

      if (meta.childNodes.length > 0) {
        body.appendChild(meta);
      }

      const copy = document.createElement("div");
      copy.className = "message-copy";
      copy.textContent = message.content;
      body.appendChild(copy);
      return body;
    }

    function renderChatDock() {
      const dockMessages = state.messages.slice(-6);
      chatDock.innerHTML = "";
      if (!dockMessages.length) {
        const empty = document.createElement("div");
        empty.className = "bubble shinobu empty";
        empty.textContent = "准备好了。发送第一条消息时会自动创建 conversation_id，之后继续发送就会走多轮上下文。";
        chatDock.appendChild(empty);
        return;
      }

      dockMessages.forEach((message) => {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${message.role === "user" ? "user" : "shinobu"}`;
        bubble.appendChild(createMessageBody(message));
        chatDock.appendChild(bubble);
      });
    }

    function renderHistory() {
      historyList.innerHTML = "";
      if (!state.messages.length) {
        const bubble = document.createElement("div");
        bubble.className = "history-bubble assistant";
        bubble.textContent = "这里会展示完整历史。首条消息发送后，右侧面板会自动切到多轮会话视图。";
        historyList.appendChild(bubble);
      } else {
        state.messages.forEach((message) => {
          const bubble = document.createElement("div");
          bubble.className = `history-bubble ${message.role === "user" ? "user" : "assistant"}`;
          bubble.appendChild(createMessageBody(message));
          historyList.appendChild(bubble);
        });
      }

      historyList.scrollTop = historyList.scrollHeight;
      renderChatDock();
      updateConversationMeta();
    }

    function updateStatusOrb() {
      const primary = !navigator.onLine
        ? state.pendingQueueCount > 0 ? `${state.pendingQueueCount} 条待同步` : "离线缓存中"
        : state.pendingQueueCount > 0 ? `${state.pendingQueueCount} 条排队` : "队列空闲";
      const secondary = state.isFlushing ? "正在自动推送" : state.pendingAssistant ? "回复流式返回中" : "自动同步已就绪";
      const tertiary = state.cacheMode === "sqlite" ? "SQLite Cache" : state.cacheMode === "fallback" ? "Fallback Cache" : "缓存初始化中";
      statusOrb.innerHTML = `<strong>${primary}</strong><span>${secondary}</span><span>${tertiary}</span>`;
    }

    function refreshConnectionUi() {
      const isOnline = navigator.onLine;
      let chipClass = "chip online";
      let chipText = "已连接原型后端";

      if (!isOnline) {
        chipClass = "chip offline";
        chipText = state.pendingQueueCount > 0 ? `离线缓存 ${state.pendingQueueCount}` : "离线模式";
      } else if (state.isFlushing) {
        chipClass = "chip queue";
        chipText = `同步中 ${state.pendingQueueCount}`;
      } else if (state.pendingQueueCount > 0) {
        chipClass = "chip queue";
        chipText = `待同步 ${state.pendingQueueCount}`;
      } else if (state.cacheMode === "fallback") {
        chipClass = "chip queue";
        chipText = "已连接（降级缓存）";
      }

      if (state.lastError && isOnline && !state.isFlushing) {
        chipClass = "chip offline";
        chipText = "同步异常";
      }

      connectionChip.className = chipClass;
      connectionChip.textContent = chipText;

      if (state.isFlushing || state.pendingAssistant) {
        historyStateChip.textContent = "SSE 返回中";
        streamStatus.textContent = `正在同步消息队列，剩余 ${state.pendingQueueCount} 条。`;
      } else if (!isOnline) {
        historyStateChip.textContent = state.pendingQueueCount > 0 ? `离线队列 ${state.pendingQueueCount}` : "离线缓存中";
        streamStatus.textContent = "当前离线：新消息会先写入本地 SQLite，恢复联网后自动推送。";
      } else if (state.pendingQueueCount > 0) {
        historyStateChip.textContent = `待同步 ${state.pendingQueueCount}`;
        streamStatus.textContent = `${state.pendingQueueCount} 条消息已入队，系统会顺序自动推送。`;
      } else {
        historyStateChip.textContent = "等待消息";
        streamStatus.textContent = "空闲中，可以发送新消息。";
      }

      streamingBadge.hidden = !(state.isFlushing || state.pendingAssistant);
      syncIdleUiState();
      updateStatusOrb();
    }

    function upsertMessageInState(message) {
      const normalized = normalizeMessageRecord(message);
      const index = state.messages.findIndex((item) => getMessageIdentity(item) === getMessageIdentity(normalized));
      if (index === -1) {
        state.messages.push(normalized);
      } else {
        state.messages[index] = { ...state.messages[index], ...normalized };
      }
      state.messages.sort(compareMessages);
      renderHistory();
    }

    function removeMessageFromState(clientMessageId) {
      state.messages = state.messages.filter((item) => getMessageIdentity(item) !== String(clientMessageId));
      renderHistory();
    }

    function clearPendingAssistant(context = null) {
      if (!state.pendingAssistant) {
        return;
      }
      if (context && state.pendingAssistant.source_client_message_id !== context.clientMessageId) {
        return;
      }
      removeMessageFromState(state.pendingAssistant.client_message_id);
      state.pendingAssistant = null;
    }

    function upsertPendingAssistant(delta, context) {
      if (!isContextActive(context.conversationKey) && !isClientMessageVisible(context.clientMessageId)) {
        return;
      }

      if (!state.pendingAssistant || state.pendingAssistant.source_client_message_id !== context.clientMessageId) {
        state.pendingAssistant = normalizeMessageRecord({
          client_message_id: `pending:${context.clientMessageId}`,
          conversation_key: context.conversationKey,
          conversation_id: state.conversationId,
          user_id: state.userId,
          role: "assistant",
          content: "",
          route_mode: context.routeMode,
          message_category: context.messageCategory,
          sync_status: "sending",
          created_at: nowIso(),
          updated_at: nowIso(),
          ephemeral: true,
          source_client_message_id: context.clientMessageId
        });
      }

      state.pendingAssistant.content += delta;
      state.pendingAssistant.updated_at = nowIso();
      upsertMessageInState(state.pendingAssistant);
      refreshConnectionUi();
    }

    function resetConversation(clearMessages = true) {
      state.conversationId = null;
      state.conversationKey = null;
      state.pendingAssistant = null;
      if (clearMessages) {
        state.messages = [];
        renderHistory();
      }
      updateConversationMeta();
      refreshConnectionUi();
    }

    function resetClientState() {
      state.userId = null;
      localStorage.removeItem(storageKeys.demoUser);
      resetConversation(true);
    }

    async function ensureDemoUser(forceRefresh = false) {
      if (!forceRefresh) {
        const cached = localStorage.getItem(storageKeys.demoUser);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed.userId) {
              state.userId = parsed.userId;
              return parsed.userId;
            }
          } catch (error) {
            localStorage.removeItem(storageKeys.demoUser);
          }
        }
      }

      if (!navigator.onLine) {
        throw new Error("离线且未找到本地身份");
      }

      const payload = {
        email: `demo-${crypto.randomUUID()}@example.com`,
        password: crypto.randomUUID(),
        display_name: "Prototype User"
      };
      const response = await fetch(`${apiBase}/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("创建 demo 用户失败");
      }

      const data = await response.json();
      const cached = { userId: data.id };
      localStorage.setItem(storageKeys.demoUser, JSON.stringify(cached));
      state.userId = data.id;
      return data.id;
    }

    async function hydrateConversationFromCache() {
      let conversationKey = state.conversationKey;
      if (!conversationKey) {
        conversationKey = await cacheAdapter.getLatestConversationKey();
      }

      if (!conversationKey) {
        state.messages = [];
        renderHistory();
        return;
      }

      state.conversationKey = conversationKey;
      const messages = await cacheAdapter.listMessages(conversationKey);
      state.messages = messages;
      const lastServerMessage = [...messages].reverse().find((message) => message.conversation_id);
      state.conversationId = lastServerMessage ? lastServerMessage.conversation_id : null;
      renderHistory();
    }

    async function reconcilePendingMessages() {
      const pendingItems = await cacheAdapter.listPendingSync();
      state.pendingQueueCount = pendingItems.length;

      for (const item of pendingItems) {
        const message = await cacheAdapter.findMessage(item.client_message_id);
        if (!message) {
          continue;
        }

        const queuedMessage = normalizeMessageRecord({
          ...message,
          sync_status: "pending",
          error_message: null,
          updated_at: nowIso()
        });
        await cacheAdapter.upsertMessage(queuedMessage);
        if (isContextActive(queuedMessage.conversation_key) || isClientMessageVisible(queuedMessage.client_message_id)) {
          upsertMessageInState(queuedMessage);
        }
      }
    }

    function createLocalMessageFromServer(message, overrides = {}) {
      return normalizeMessageRecord({
        id: message.id,
        client_message_id: message.client_message_id,
        server_message_id: message.id,
        conversation_key: overrides.conversation_key || state.conversationKey || `server:${message.conversation_id}`,
        conversation_id: message.conversation_id,
        user_id: overrides.user_id || state.userId || "",
        role: message.role,
        content: message.content,
        route_mode: message.route_mode,
        message_category: message.message_category,
        sync_status: overrides.sync_status || "synced",
        error_message: overrides.error_message || null,
        created_at: message.created_at,
        updated_at: overrides.updated_at || message.created_at
      });
    }

    function parseSseEvent(rawEvent) {
      const lines = rawEvent.split("\n");
      let eventName = "message";
      const dataLines = [];

      lines.forEach((line) => {
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim();
        } else if (line.startsWith("data:")) {
          dataLines.push(line.slice(5).trim());
        }
      });

      const payload = dataLines.length ? JSON.parse(dataLines.join("\n")) : {};
      return { eventName, payload };
    }

    async function handleStreamEvent(eventName, payload, context) {
      if (eventName === "conversation") {
        const serverConversationId = payload.conversation_id;
        const targetConversationKey = `server:${serverConversationId}`;
        const sourceConversationKey = context.conversationKey;

        if (sourceConversationKey !== targetConversationKey) {
          await cacheAdapter.promoteConversationKey(sourceConversationKey, targetConversationKey, serverConversationId);
          context.conversationKey = targetConversationKey;
        }

        if (isContextActive(sourceConversationKey) || isClientMessageVisible(context.clientMessageId)) {
          state.conversationId = serverConversationId;
          state.conversationKey = context.conversationKey;
          setConversationPanelOpen(true);
        }

        const userMessage = createLocalMessageFromServer(payload.user_message, {
          conversation_key: context.conversationKey,
          user_id: state.userId,
          sync_status: "synced"
        });
        await cacheAdapter.upsertMessage(userMessage);
        if (isContextActive(context.conversationKey) || isClientMessageVisible(context.clientMessageId)) {
          upsertMessageInState(userMessage);
        }
        refreshConnectionUi();
        return;
      }

      if (eventName === "chunk") {
        upsertPendingAssistant(payload.delta || "", context);
        return;
      }

      if (eventName === "done") {
        clearPendingAssistant(context);
        const assistantMessage = createLocalMessageFromServer(payload.assistant_message, {
          conversation_key: context.conversationKey,
          user_id: state.userId,
          sync_status: "synced"
        });
        await cacheAdapter.upsertMessage(assistantMessage);

        const userMessage = await cacheAdapter.findMessage(context.clientMessageId);
        if (userMessage) {
          const syncedUserMessage = normalizeMessageRecord({
            ...userMessage,
            conversation_key: context.conversationKey,
            conversation_id: state.conversationId || userMessage.conversation_id,
            sync_status: "synced",
            error_message: null,
            updated_at: assistantMessage.created_at
          });
          await cacheAdapter.upsertMessage(syncedUserMessage);
          if (isContextActive(context.conversationKey) || isClientMessageVisible(context.clientMessageId)) {
            upsertMessageInState(syncedUserMessage);
          }
        }

        await cacheAdapter.dequeuePending(context.clientMessageId);
        state.pendingQueueCount = await cacheAdapter.getPendingCount();
        state.lastError = null;
        if (isContextActive(context.conversationKey) || isClientMessageVisible(context.clientMessageId)) {
          upsertMessageInState(assistantMessage);
        }
        refreshConnectionUi();
      }
    }

    async function consumeSse(response, context) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) {
          break;
        }

        buffer += decoder.decode(value, { stream: true });
        let boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          const rawEvent = buffer.slice(0, boundary).trim();
          buffer = buffer.slice(boundary + 2);
          if (rawEvent) {
            const { eventName, payload } = parseSseEvent(rawEvent);
            await handleStreamEvent(eventName, payload, context);
          }
          boundary = buffer.indexOf("\n\n");
        }
      }
    }

    async function recoverMissingRemoteState(item, payload, existingMessage) {
      const sourceConversationKey = item.conversation_key;
      const nextConversationKey = sourceConversationKey.startsWith("server:") ? buildConversationKey() : sourceConversationKey;
      await ensureDemoUser(true);

      if (sourceConversationKey !== nextConversationKey) {
        await cacheAdapter.rebindConversationKey(sourceConversationKey, nextConversationKey);
        rebindConversationState(sourceConversationKey, nextConversationKey);
      }

      if (existingMessage) {
        const reboundMessage = normalizeMessageRecord({
          ...existingMessage,
          user_id: state.userId,
          conversation_key: nextConversationKey,
          conversation_id: null,
          sync_status: "pending",
          error_message: null,
          updated_at: nowIso()
        });
        await cacheAdapter.upsertMessage(reboundMessage);
        if (isContextActive(sourceConversationKey) || isContextActive(nextConversationKey) || isClientMessageVisible(existingMessage.client_message_id)) {
          upsertMessageInState(reboundMessage);
        }
      }

      await cacheAdapter.enqueuePending({
        ...item,
        conversation_key: nextConversationKey,
        payload_json: JSON.stringify({
          ...payload,
          user_id: state.userId,
          conversation_id: null
        }),
        last_error: null,
        next_retry_at: null,
        updated_at: nowIso()
      });
      state.pendingQueueCount = await cacheAdapter.getPendingCount();
      refreshConnectionUi();
      showToast("本地身份已刷新，消息将自动重试。");
      window.setTimeout(() => {
        flushPendingQueue();
      }, 0);
    }

    function clearComposer() {
      messageInput.value = "";
      panelMessageInput.value = "";
    }

    async function processPendingItem(item) {
      const payload = JSON.parse(item.payload_json);
      const context = {
        clientMessageId: String(payload.client_message_id),
        conversationKey: item.conversation_key,
        routeMode: String(payload.route_mode),
        messageCategory: String(payload.message_category)
      };

      const existingMessage = await cacheAdapter.findMessage(context.clientMessageId);
      if (existingMessage) {
        const sendingMessage = normalizeMessageRecord({
          ...existingMessage,
          sync_status: "sending",
          error_message: null,
          updated_at: nowIso()
        });
        await cacheAdapter.upsertMessage(sendingMessage);
        if (isContextActive(context.conversationKey) || isClientMessageVisible(context.clientMessageId)) {
          upsertMessageInState(sendingMessage);
        }
      }

      state.isFlushing = true;
      state.lastError = null;
      refreshConnectionUi();

      try {
        const response = await fetch(`${apiBase}/messages`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream"
          },
          body: JSON.stringify({
            user_id: state.userId,
            client_message_id: payload.client_message_id,
            conversation_id: payload.conversation_id,
            content: payload.content,
            route_mode: payload.route_mode,
            message_category: payload.message_category
          })
        });

        if (response.status === 404) {
          await recoverMissingRemoteState(item, payload, existingMessage);
          return false;
        }

        if (!response.ok || !response.body) {
          throw new Error(response.status === 404 ? "服务端未找到用户或会话" : "消息接口返回失败");
        }

        await consumeSse(response, context);
        return true;
      } catch (error) {
        clearPendingAssistant(context);
        const isOfflineError = !navigator.onLine || error instanceof TypeError;
        const errorMessage = error instanceof Error ? error.message : "同步失败";
        state.lastError = errorMessage;

        if (existingMessage) {
          const failedMessage = normalizeMessageRecord({
            ...existingMessage,
            sync_status: isOfflineError ? "pending" : "failed",
            error_message: isOfflineError ? null : errorMessage,
            updated_at: nowIso()
          });
          await cacheAdapter.upsertMessage(failedMessage);
          if (isContextActive(context.conversationKey) || isClientMessageVisible(context.clientMessageId)) {
            upsertMessageInState(failedMessage);
          }
        }

        await cacheAdapter.enqueuePending({
          ...item,
          attempt_count: Number(item.attempt_count || 0) + 1,
          last_error: isOfflineError ? null : errorMessage,
          next_retry_at: null,
          updated_at: nowIso()
        });
        state.pendingQueueCount = await cacheAdapter.getPendingCount();
        refreshConnectionUi();
        if (!isOfflineError) {
          showToast(errorMessage);
        }
        return false;
      } finally {
        state.isFlushing = false;
        refreshConnectionUi();
      }
    }

    async function flushPendingQueue() {
      if (!state.bootstrapComplete || !navigator.onLine || state.isFlushing || !state.userId) {
        refreshConnectionUi();
        return;
      }

      await cacheAdapter.flushQueue(async (item) => {
        if (!navigator.onLine) {
          return false;
        }
        if (item.next_retry_at && new Date(item.next_retry_at).getTime() > Date.now()) {
          return true;
        }
        return await processPendingItem(item);
      });

      state.pendingQueueCount = await cacheAdapter.getPendingCount();
      refreshConnectionUi();
    }

    async function sendMessage(content) {
      const trimmed = content.trim();
      if (!trimmed) {
        return;
      }

      if (!state.userId) {
        try {
          await ensureDemoUser();
        } catch (error) {
          showToast("当前离线且没有可用身份，暂时无法发送。");
          return;
        }
      }

      if (!state.conversationKey) {
        state.conversationKey = state.conversationId ? `server:${state.conversationId}` : buildConversationKey();
      }

      const category = classifyMessageCategory(trimmed, state.routeMode);
      const createdAt = nowIso();
      const message = normalizeMessageRecord({
        client_message_id: crypto.randomUUID(),
        conversation_key: state.conversationKey,
        conversation_id: state.conversationId,
        user_id: state.userId,
        role: "user",
        content: trimmed,
        route_mode: state.routeMode,
        message_category: category,
        sync_status: "pending",
        error_message: null,
        created_at: createdAt,
        updated_at: createdAt
      });

      upsertMessageInState(message);
      await cacheAdapter.upsertMessage(message);
      await cacheAdapter.enqueuePending({
        client_message_id: message.client_message_id,
        conversation_key: message.conversation_key,
        payload_json: JSON.stringify(buildPendingPayload(message)),
        attempt_count: 0,
        last_error: null,
        next_retry_at: null,
        created_at: createdAt,
        updated_at: createdAt
      });

      state.pendingQueueCount = await cacheAdapter.getPendingCount();
      updateConversationMeta();
      refreshConnectionUi();
      clearComposer();

      if (!navigator.onLine) {
        showToast("已离线缓存，恢复联网后会自动推送。");
        return;
      }

      await flushPendingQueue();
    }

    async function bootstrap(retry = true) {
      connectionChip.textContent = "初始化缓存中...";
      try {
        state.cacheMode = await cacheAdapter.init();
        await ensureDemoUser();
        updateRouteMode(state.routeMode);
        await hydrateConversationFromCache();
        await reconcilePendingMessages();
        state.bootstrapComplete = true;
        refreshConnectionUi();
        if (navigator.onLine) {
          await flushPendingQueue();
        }
      } catch (error) {
        if (retry) {
          resetClientState();
          await bootstrap(false);
          return;
        }
        const message = error instanceof Error ? error.message : "初始化失败";
        connectionChip.className = "chip offline";
        connectionChip.textContent = `连接失败: ${message}`;
        showToast(message);
      }
    }

    composerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      await sendMessage(messageInput.value);
    });

    panelSendBtn.addEventListener("click", async () => {
      await sendMessage(panelMessageInput.value);
    });

    panelMessageInput.addEventListener("keydown", async (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        await sendMessage(panelMessageInput.value);
      }
    });

    conversationToggle.addEventListener("click", () => {
      const isOpen = !liveRoom.classList.contains("conversation-open");
      setConversationPanelOpen(isOpen);
    });

    openConversationBtn.addEventListener("click", () => {
      const isOpen = !liveRoom.classList.contains("conversation-open");
      setConversationPanelOpen(isOpen);
    });

    newConversationBtn.addEventListener("click", () => {
      resetConversation(true);
      showToast("已切换到新对话，下一条消息会创建新的本地会话。");
    });

    document.querySelectorAll("[data-route-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        updateRouteMode(button.dataset.routeMode);
      });
    });

    window.addEventListener("resize", applyResponsiveLayout);
    window.addEventListener("online", async () => {
      state.lastError = null;
      refreshConnectionUi();
      await flushPendingQueue();
    });
    window.addEventListener("offline", () => {
      refreshConnectionUi();
    });

    applyResponsiveLayout();
    refreshConnectionUi();
    bootstrap();
  </script>
</body>
</html>
