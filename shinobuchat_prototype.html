<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShinobuChat Prototype</title>
  <style>
    :root {
      --bg-1: #e7d1b8;
      --bg-2: #f7ede3;
      --bg-3: #c8d7de;
      --ink: #2e2723;
      --muted: #7b6e64;
      --line: rgba(122, 88, 58, 0.18);
      --panel: rgba(255, 250, 243, 0.78);
      --accent: #c25a39;
      --accent-deep: #8d3f2d;
      --conversation-right: 24px;
      --conversation-width: min(388px, calc(100vw - 48px));
      --mint: #dcefe6;
      --mint-ink: #276050;
      --shadow: 0 24px 60px rgba(66, 42, 25, 0.16);
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --content-width: min(1240px, calc(100vw - 28px));
      --room-width: var(--content-width);
      --room-height: calc(100vh - 28px);
      --edge-gap: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.72), transparent 24%),
        linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
    }

    button, input, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 14px;
    }

    .live-room {
      position: relative;
      width: var(--room-width);
      height: var(--room-height);
      overflow: hidden;
      border: 1px solid rgba(128, 98, 72, 0.16);
      border-radius: 34px;
      background:
        linear-gradient(rgba(25, 32, 39, 0.08), rgba(26, 22, 20, 0.22)),
        radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.88), transparent 22%),
        linear-gradient(120deg, #dbe7ef 0%, #f6efe7 46%, #7f8b92 100%);
      box-shadow: var(--shadow);
    }

    .live-room::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.14) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.18;
      pointer-events: none;
    }

    .top-live-bar {
      position: absolute;
      top: var(--edge-gap);
      left: var(--edge-gap);
      right: var(--edge-gap);
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 999px;
      background: rgba(255, 249, 241, 0.75);
      backdrop-filter: blur(18px);
      box-shadow: 0 14px 40px rgba(61, 44, 31, 0.14);
    }

    .brand {
      padding-left: 8px;
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 252, 247, 0.8);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip.online {
      background: var(--mint);
      color: var(--mint-ink);
    }

    .chip.strong {
      color: var(--accent-deep);
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pill-btn,
    .send-btn,
    .ghost-btn,
    .route-chip {
      border: 1px solid var(--line);
      transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }

    .pill-btn:hover,
    .ghost-btn:hover,
    .route-chip:hover {
      transform: translateY(-1px);
      border-color: rgba(194, 90, 57, 0.38);
    }

    .pill-btn,
    .ghost-btn {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      background: rgba(255, 250, 243, 0.84);
      color: var(--ink);
      font-weight: 800;
    }

    .ghost-btn {
      background: transparent;
    }

    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding-top: clamp(54px, 7.2%, 74px);
      pointer-events: none;
    }

    .avatar {
      position: relative;
      width: clamp(240px, 31%, 380px);
      aspect-ratio: 0.58;
      filter: drop-shadow(0 28px 36px rgba(53, 40, 34, 0.2));
    }

    .hair,
    .body,
    .face,
    .collar,
    .tail-left,
    .tail-right,
    .eye,
    .mouth {
      position: absolute;
    }

    .hair {
      left: 12%;
      top: 8%;
      width: 76%;
      height: 42%;
      border-radius: 48% 48% 42% 42%;
      background: linear-gradient(135deg, #fff7fb, #dac8cf 72%, #baa2aa);
    }

    .face {
      z-index: 2;
      left: 27%;
      top: 22%;
      width: 46%;
      height: 31%;
      border-radius: 46% 46% 48% 48%;
      background: linear-gradient(#fff0e9, #edd4ce);
      border: 1px solid rgba(127, 91, 87, 0.14);
    }

    .eye {
      top: 43%;
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 48% 42%, #edf9ff 0 12%, #75b4e7 14% 38%, #4758be 42% 64%, #252a64 68%);
      box-shadow: 0 0 0 4px rgba(55, 64, 108, 0.12);
    }

    .eye.left { left: 25%; }
    .eye.right { right: 25%; }

    .mouth {
      left: 45%;
      top: 73%;
      width: 10%;
      height: 4%;
      border-bottom: 3px solid rgba(96, 58, 57, 0.52);
      border-radius: 50%;
    }

    .body {
      left: 21%;
      bottom: 0;
      width: 58%;
      height: 52%;
      border-radius: 42% 42% 10% 10%;
      background: linear-gradient(90deg, #d9edf6, #fbf5ee 44%, #c5d7e2);
      border: 1px solid rgba(74, 88, 99, 0.12);
    }

    .collar {
      z-index: 3;
      left: 36%;
      top: 50%;
      width: 28%;
      height: 9%;
      border-radius: 50%;
      background: #58515b;
    }

    .tail-left,
    .tail-right {
      top: 14%;
      width: 18%;
      height: 54%;
      border-radius: 50% 50% 45% 45%;
      background: linear-gradient(#fff8fb, #ccb7bf);
    }

    .tail-left {
      left: 3%;
      transform: rotate(18deg);
    }

    .tail-right {
      right: 3%;
      transform: rotate(-18deg);
    }

    .chat-dock {
      position: absolute;
      left: calc(var(--edge-gap) + 6px);
      bottom: clamp(104px, 12%, 128px);
      z-index: 6;
      width: clamp(280px, calc(46% - var(--edge-gap)), 520px);
      display: grid;
      gap: 12px;
      align-content: end;
    }

    .bubble,
    .history-bubble,
    .streaming-badge,
    .meta-card {
      box-shadow: 0 14px 34px rgba(51, 39, 31, 0.12);
    }

    .bubble {
      width: fit-content;
      max-width: 100%;
      padding: 14px 18px;
      border-radius: var(--radius-sm);
      line-height: 1.58;
      font-size: 15px;
      font-weight: 620;
    }

    .bubble.user {
      justify-self: end;
      color: #fff8ef;
      background: linear-gradient(135deg, var(--accent), #b84a29);
    }

    .bubble.shinobu {
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 250, 244, 0.9);
      backdrop-filter: blur(16px);
    }

    .bubble.empty {
      max-width: 420px;
      border: 1px dashed rgba(141, 63, 45, 0.2);
      color: var(--muted);
      background: rgba(255, 250, 244, 0.5);
    }

    .streaming-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      color: var(--accent-deep);
      background: rgba(255, 249, 241, 0.82);
      font-size: 13px;
      font-weight: 800;
    }

    .streaming-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1); opacity: 1; }
    }

    @keyframes ambientBreath {
      0%, 100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 14px 32px rgba(57, 42, 31, 0.12);
      }
      50% {
        transform: translateY(-2px) scale(1.012);
        box-shadow: 0 18px 38px rgba(57, 42, 31, 0.16);
      }
    }

    .conversation-toggle {
      position: absolute;
      right: calc(var(--conversation-right) + var(--conversation-width) - 18px);
      top: 50%;
      z-index: 8;
      width: 42px;
      height: 92px;
      border: 0;
      border-radius: 14px 0 0 14px;
      background: rgba(255, 248, 239, 0.96);
      color: var(--accent-deep);
      font-size: 26px;
      font-weight: 900;
      box-shadow: -10px 12px 28px rgba(64, 40, 22, 0.16);
      transform: translateY(-50%);
      transition: transform 0.18s ease, background 0.16s ease, color 0.16s ease;
    }

    .conversation-panel {
      position: absolute;
      top: calc(var(--edge-gap) + 54px);
      right: var(--conversation-right);
      bottom: var(--edge-gap);
      z-index: 7;
      width: var(--conversation-width);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: var(--radius-lg);
      background: rgba(255, 250, 243, 0.82);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 48px rgba(51, 39, 31, 0.16);
      transform: translateX(calc(100% + 20px));
      opacity: 0;
      pointer-events: none;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .live-room.conversation-open .conversation-panel {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
    }

    .live-room.conversation-open .conversation-toggle {
      right: calc(var(--conversation-right) + var(--conversation-width) - 18px);
      transform: translateY(-50%) scaleX(-1);
    }

    .conversation-toggle:hover {
      background: var(--accent);
      color: #fff8ef;
    }

    .live-room.idle-ui:not(.conversation-open) .conversation-toggle {
      animation: ambientBreath 3.4s ease-in-out infinite;
    }

    .live-room.idle-ui:not(.conversation-open) .conversation-toggle:hover,
    .live-room.idle-ui:not(.conversation-open) .conversation-toggle:focus-visible {
      animation: none;
    }

    .status-orb {
      position: absolute;
      right: var(--edge-gap);
      bottom: max(16px, calc(var(--edge-gap) - 4px));
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.56);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 250, 243, 0.84);
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 32px rgba(57, 42, 31, 0.12);
      font-size: 13px;
      font-weight: 780;
    }

    .status-orb strong {
      color: var(--accent-deep);
    }

    .status-orb.synced {
      color: #276050;
      background: rgba(220, 239, 230, 0.88);
    }

    .status-orb.sync-pending {
      color: var(--muted);
    }

    .live-room.conversation-open .status-orb {
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
    }

    .live-room.idle-ui:not(.conversation-open) .status-orb {
      animation: ambientBreath 3.8s ease-in-out infinite;
    }

    .live-room.idle-ui:not(.conversation-open) .status-orb:hover,
    .live-room.idle-ui:not(.conversation-open) .status-orb:focus-visible {
      animation: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .live-room.idle-ui .conversation-toggle,
      .live-room.idle-ui .status-orb {
        animation: none;
      }
    }

    .conversation-head,
    .composer-head,
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      color: var(--accent-deep);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .meta-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255, 252, 247, 0.8);
    }

    .meta-grid {
      display: grid;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .meta-row strong {
      color: var(--ink);
      font-weight: 800;
    }

    .history-list {
      min-height: 0;
      overflow: auto;
      display: grid;
      gap: 10px;
      padding-right: 4px;
      align-content: start;
    }

    .history-bubble {
      max-width: 88%;
      padding: 13px 15px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      line-height: 1.56;
      font-weight: 620;
    }

    .history-bubble.user {
      justify-self: end;
      color: #fff8ef;
      background: linear-gradient(135deg, var(--accent), #b84a29);
    }

    .history-bubble.assistant {
      border: 1px solid var(--line);
      background: rgba(255, 252, 247, 0.84);
    }

    .conversation-composer,
    .input-bar {
      border: 1px solid rgba(255, 255, 255, 0.56);
      background: rgba(255, 250, 243, 0.8);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 40px rgba(57, 42, 31, 0.14);
    }

    .conversation-composer {
      display: grid;
      gap: 12px;
      padding: 14px;
      border-radius: 18px;
    }

    .route-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .route-chip {
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .route-chip.active {
      color: #fff8ef;
      background: var(--accent);
      border-color: transparent;
    }

    .route-hint,
    .status-note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 720;
    }

    .conversation-textarea,
    .message-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
    }

    .conversation-textarea:focus,
    .message-input:focus {
      border-color: rgba(194, 90, 57, 0.44);
      box-shadow: 0 0 0 3px rgba(194, 90, 57, 0.08);
    }

    .conversation-textarea {
      min-height: 92px;
      padding: 13px 14px;
      resize: vertical;
      line-height: 1.56;
    }

    .input-bar {
      position: absolute;
      left: 50%;
      bottom: max(16px, calc(var(--edge-gap) - 4px));
      z-index: 8;
      width: clamp(420px, calc(100% - (var(--edge-gap) * 2) - 220px), 760px);
      transform: translateX(-50%);
      display: grid;
      gap: 10px;
      padding: 12px;
      border-radius: 28px;
    }

    .input-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 98px;
      gap: 10px;
      align-items: center;
    }

    .message-input {
      min-height: 48px;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 650;
    }

    .composer-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .send-btn {
      min-height: 48px;
      border-radius: 999px;
      border-color: transparent;
      color: #fffaf4;
      background: var(--accent);
      font-weight: 900;
    }

    .send-btn:disabled,
    .pill-btn:disabled,
    .ghost-btn:disabled,
    .message-input:disabled,
    .conversation-textarea:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .toast-stack {
      position: absolute;
      top: calc(var(--edge-gap) + 78px);
      right: calc(var(--edge-gap) + 4px);
      z-index: 12;
      width: min(320px, calc(100% - (var(--edge-gap) * 2)));
      display: grid;
      gap: 10px;
      pointer-events: none;
    }

    .live-room.layout-compact {
      --edge-gap: 18px;
    }

    .live-room.layout-compact .top-live-bar {
      padding: 8px 10px;
    }

    .live-room.layout-compact .chat-dock {
      width: clamp(260px, calc(44% - var(--edge-gap)), 440px);
      bottom: clamp(98px, 11%, 118px);
    }

    .live-room.layout-compact .avatar {
      width: clamp(220px, 29%, 332px);
    }

    .live-room.layout-compact .input-bar {
      width: clamp(400px, calc(100% - (var(--edge-gap) * 2) - 170px), 700px);
    }

    .live-room.layout-tight {
      --edge-gap: 14px;
    }

    .live-room.layout-tight .top-live-bar {
      gap: 8px;
      padding: 8px 10px;
    }

    .live-room.layout-tight .chip,
    .live-room.layout-tight .pill-btn,
    .live-room.layout-tight .ghost-btn {
      min-height: 32px;
      padding: 0 12px;
      font-size: 12px;
    }

    .live-room.layout-tight .chat-dock {
      width: clamp(240px, calc(42% - var(--edge-gap)), 360px);
      gap: 10px;
      bottom: 92px;
    }

    .live-room.layout-tight .bubble {
      padding: 12px 14px;
      font-size: 14px;
    }

    .live-room.layout-tight .avatar {
      width: clamp(200px, 28%, 288px);
    }

    .live-room.layout-tight .input-bar {
      width: clamp(360px, calc(100% - (var(--edge-gap) * 2) - 132px), 620px);
      padding: 10px;
    }

    .live-room.layout-tight .message-input,
    .live-room.layout-tight .send-btn {
      min-height: 44px;
    }

    .toast {
      padding: 12px 14px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 14px;
      background: rgba(255, 250, 243, 0.92);
      box-shadow: 0 16px 38px rgba(49, 37, 29, 0.14);
      font-size: 13px;
      font-weight: 760;
      line-height: 1.45;
    }

    @media (max-width: 1080px) {
      .conversation-toggle {
        right: 24px;
        top: auto;
        bottom: 340px;
        height: 56px;
        width: 56px;
        border-radius: 50%;
        transform: none;
      }

      .live-room.conversation-open .conversation-toggle {
        right: 24px;
      }

      .conversation-panel {
        left: 14px;
        right: 14px;
        top: 86px;
        bottom: 122px;
        width: auto;
      }

      .status-orb {
        right: 16px;
        bottom: 12px;
      }

      .chat-dock {
        right: 18px;
        width: auto;
      }
    }

    @media (max-width: 760px) {
      .app-shell {
        padding: 0;
      }

      .live-room {
        width: 100vw;
        min-height: 100vh;
        border-radius: 0;
      }

      .top-live-bar {
        left: 12px;
        right: 12px;
        top: 12px;
        flex-wrap: wrap;
        border-radius: 24px;
      }

      .brand,
      .top-actions {
        width: 100%;
      }

      .top-actions {
        margin-left: 0;
        justify-content: space-between;
      }

      .chat-dock {
        left: 14px;
        right: 14px;
        bottom: 164px;
        width: auto;
      }

      .input-bar {
        left: 12px;
        right: 12px;
        width: auto;
        transform: none;
        bottom: 12px;
      }

      .status-orb {
        left: 12px;
        right: 12px;
        justify-content: center;
      }

      .input-main {
        grid-template-columns: 1fr;
      }

      .composer-actions {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="live-room" id="liveRoom" aria-label="ShinobuChat Prototype">
      <header class="top-live-bar">
        <div class="brand">ShinobuChat Live</div>
        <span class="chip online" id="connectionChip">已连接原型后端</span>
        <span class="chip strong" id="modeChip">自动决策</span>
        <span class="chip" id="conversationMeta">conversation_id: 未创建</span>
        <div class="top-actions">
          <button class="pill-btn" type="button" id="newConversationBtn">新对话</button>
          <button class="ghost-btn" type="button" id="openConversationBtn">展开会话</button>
        </div>
      </header>

      <div class="stage" aria-hidden="true">
        <div class="avatar">
          <div class="tail-left"></div>
          <div class="tail-right"></div>
          <div class="hair"></div>
          <div class="face">
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="mouth"></span>
          </div>
          <div class="collar"></div>
          <div class="body"></div>
        </div>
      </div>

      <section class="chat-dock" id="chatDock" aria-label="消息气泡区">
        <div class="bubble shinobu empty">准备好了。发送第一条消息时会自动创建 conversation_id，之后继续发送就会走多轮上下文。</div>
      </section>

      <button class="conversation-toggle" type="button" id="conversationToggle" aria-expanded="false" aria-label="打开会话历史">‹</button>

      <aside class="conversation-panel" id="conversationPanel" aria-label="会话历史侧栏">
        <div class="conversation-head">
          <div class="section-title">Conversation Log</div>
          <span class="chip strong" id="historyStateChip">等待消息</span>
        </div>

        <section class="meta-card">
          <div class="section-title">Session Meta</div>
          <div class="meta-grid">
            <div class="meta-row"><span>当前路由</span><strong id="routeModeMeta">自动决策</strong></div>
            <div class="meta-row"><span>会话模式</span><strong id="conversationModeMeta">单轮待开始</strong></div>
            <div class="meta-row"><span>消息数量</span><strong id="messageCountMeta">0</strong></div>
          </div>
        </section>

        <div class="history-list" id="historyList"></div>

        <section class="conversation-composer">
          <div class="composer-head">
            <div class="section-title">发送消息</div>
            <span class="chip" id="panelConversationMeta">未创建 conversation_id</span>
          </div>
          <div class="route-chip-row">
            <button class="route-chip active" type="button" data-route-mode="auto">自动决策</button>
            <button class="route-chip" type="button" data-route-mode="chat">纯聊天</button>
            <button class="route-chip" type="button" data-route-mode="agent">强制 Agent</button>
          </div>
          <div class="route-hint" id="panelRouteHint">自动决策：首条消息默认创建会话，后续沿用当前 conversation_id。</div>
          <textarea class="conversation-textarea" id="panelMessageInput" placeholder="例如：今天先帮我梳理一下工作重点。"></textarea>
          <div class="status-row">
            <div class="status-note" id="streamStatus">空闲中，可以发送新消息。</div>
            <button class="send-btn" type="button" id="panelSendBtn">发送</button>
          </div>
        </section>
      </aside>

      <button class="status-orb" type="button" id="statusOrb">
        <strong>今日 4 Todo</strong>
        <span id="agentSyncState">Agent 空闲</span>
        <span id="iosSyncState">iOS 待同步</span>
      </button>

      <form class="input-bar" id="composerForm" aria-label="主发送栏">
        <div class="route-chip-row">
          <button class="route-chip active" type="button" data-route-mode="auto">自动决策</button>
          <button class="route-chip" type="button" data-route-mode="chat">纯聊天</button>
          <button class="route-chip" type="button" data-route-mode="agent">强制 Agent</button>
        </div>
        <div class="composer-actions">
          <div class="route-hint" id="routeHint">自动决策：首条消息默认创建会话，后续沿用当前 conversation_id。</div>
          <span class="streaming-badge" id="streamingBadge" hidden>
            <span class="streaming-dot"></span>
            SSE 流式响应中
          </span>
        </div>
        <div class="input-main">
          <input class="message-input" id="messageInput" type="text" placeholder="和 Shinobu 聊天，或者给她安排一个任务" />
          <button class="send-btn" id="sendBtn" type="submit">发送</button>
        </div>
      </form>

      <section class="toast-stack" id="toastStack" aria-live="polite"></section>
    </section>
  </main>

  <script>
    const apiBase = "/api/v1";
    const storageKeys = {
      demoUser: "shinobu-demo-user",
      conversationId: "shinobu-conversation-id",
      routeMode: "shinobu-route-mode",
      syncDeviceId: "shinobu-sync-device-id"
    };

    const routeModeConfig = {
      auto: {
        label: "自动决策",
        hint: "自动决策：首条消息默认创建会话，后续沿用当前 conversation_id。"
      },
      chat: {
        label: "纯聊天",
        hint: "纯聊天：只保留对话推进，不强调任务化拆解。"
      },
      agent: {
        label: "强制 Agent",
        hint: "强制 Agent：每条消息都按任务处理口径组织回复。"
      }
    };

    const state = {
      userId: null,
      conversationId: localStorage.getItem(storageKeys.conversationId),
      routeMode: localStorage.getItem(storageKeys.routeMode) || "auto",
      messages: [],
      isStreaming: false,
      pendingAssistantId: null,
      syncSource: null,
      syncStatus: null
    };

    const liveRoom = document.getElementById("liveRoom");
    const chatDock = document.getElementById("chatDock");
    const historyList = document.getElementById("historyList");
    const conversationToggle = document.getElementById("conversationToggle");
    const openConversationBtn = document.getElementById("openConversationBtn");
    const modeChip = document.getElementById("modeChip");
    const routeHint = document.getElementById("routeHint");
    const panelRouteHint = document.getElementById("panelRouteHint");
    const conversationMeta = document.getElementById("conversationMeta");
    const panelConversationMeta = document.getElementById("panelConversationMeta");
    const routeModeMeta = document.getElementById("routeModeMeta");
    const conversationModeMeta = document.getElementById("conversationModeMeta");
    const messageCountMeta = document.getElementById("messageCountMeta");
    const historyStateChip = document.getElementById("historyStateChip");
    const connectionChip = document.getElementById("connectionChip");
    const streamStatus = document.getElementById("streamStatus");
    const streamingBadge = document.getElementById("streamingBadge");
    const toastStack = document.getElementById("toastStack");
    const messageInput = document.getElementById("messageInput");
    const panelMessageInput = document.getElementById("panelMessageInput");
    const sendBtn = document.getElementById("sendBtn");
    const panelSendBtn = document.getElementById("panelSendBtn");
    const newConversationBtn = document.getElementById("newConversationBtn");
    const composerForm = document.getElementById("composerForm");
    const agentSyncState = document.getElementById("agentSyncState");
    const iosSyncState = document.getElementById("iosSyncState");

    function getSyncDeviceId() {
      const existing = localStorage.getItem(storageKeys.syncDeviceId);
      if (existing) return existing;
      const nextId = crypto.randomUUID ? crypto.randomUUID() : `web-${Date.now()}`;
      localStorage.setItem(storageKeys.syncDeviceId, nextId);
      return nextId;
    }

    function updateStatusOrb() {
      const status = state.syncStatus;
      const iosSynced = Boolean(status && status.ios_synced);
      statusOrb.classList.toggle("synced", iosSynced);
      statusOrb.classList.toggle("sync-pending", !iosSynced);
      agentSyncState.textContent = state.isStreaming ? "Agent 回复中" : "Agent 空闲";
      iosSyncState.textContent = iosSynced ? "iOS 已同步" : "iOS 待同步";
      if (status) {
        statusOrb.title = `在线设备 ${status.online_devices}，iOS 在线 ${status.online_ios_devices}，APNs ${status.ios_push_targets}`;
      }
    }

    function connectRealtimeSync() {
      if (!state.userId || state.syncSource) return;
      const params = new URLSearchParams({
        user_id: state.userId,
        device_id: getSyncDeviceId(),
        device_type: "web"
      });
      const source = new EventSource(`${apiBase}/sync/events?${params}`);
      state.syncSource = source;

      ["sync.connected", "presence.changed", "sync.heartbeat", "message.synced"].forEach((eventName) => {
        source.addEventListener(eventName, (event) => {
          const payload = JSON.parse(event.data);
          state.syncStatus = payload;
          updateStatusOrb();
          if (eventName === "message.synced" && payload.conversation_id === state.conversationId) {
            const exists = state.messages.some((item) => item.id === payload.message.id);
            if (!exists) {
              appendMessage(payload.message);
            }
          }
        });
      });

      source.onerror = () => {
        state.syncSource = null;
        source.close();
        window.setTimeout(connectRealtimeSync, 1600);
      };
    }

    function showToast(message) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      toastStack.prepend(toast);
      window.setTimeout(() => toast.remove(), 2600);
    }

    function setConversationPanelOpen(isOpen) {
      liveRoom.classList.toggle("conversation-open", isOpen);
      conversationToggle.setAttribute("aria-expanded", String(isOpen));
      conversationToggle.textContent = isOpen ? "›" : "‹";
      openConversationBtn.textContent = isOpen ? "收起会话" : "展开会话";
    }

    function syncIdleUiState() {
      liveRoom.classList.toggle("idle-ui", !state.isStreaming);
      updateStatusOrb();
    }

    function applyResponsiveLayout() {
      if (window.innerWidth <= 760) {
        liveRoom.style.removeProperty("--room-width");
        liveRoom.style.removeProperty("--room-height");
        liveRoom.style.removeProperty("--edge-gap");
        liveRoom.style.removeProperty("--conversation-right");
        liveRoom.classList.remove("layout-compact", "layout-tight");
        return;
      }

      const shellPadding = window.innerWidth <= 1080 ? 24 : 28;
      const maxWidth = Math.min(1240, window.innerWidth - shellPadding);
      const maxHeight = Math.min(980, window.innerHeight - shellPadding);
      const roomRatio = 1.22;

      let roomWidth = Math.min(maxWidth, maxHeight * roomRatio);
      let roomHeight = roomWidth / roomRatio;

      if (roomHeight > maxHeight) {
        roomHeight = maxHeight;
        roomWidth = roomHeight * roomRatio;
      }

      const edgeGap =
        roomWidth < 980 || roomHeight < 720 ? 14 :
        roomWidth < 1140 || roomHeight < 820 ? 18 : 22;

      liveRoom.style.setProperty("--room-width", `${Math.round(roomWidth)}px`);
      liveRoom.style.setProperty("--room-height", `${Math.round(roomHeight)}px`);
      liveRoom.style.setProperty("--edge-gap", `${edgeGap}px`);
      liveRoom.style.setProperty("--conversation-right", `${edgeGap}px`);
      liveRoom.classList.toggle("layout-compact", roomWidth < 1140 || roomHeight < 820);
      liveRoom.classList.toggle("layout-tight", roomWidth < 980 || roomHeight < 720);
    }

    function updateRouteMode(nextMode) {
      state.routeMode = nextMode;
      localStorage.setItem(storageKeys.routeMode, nextMode);
      const config = routeModeConfig[nextMode];
      modeChip.textContent = config.label;
      routeModeMeta.textContent = config.label;
      routeHint.textContent = config.hint;
      panelRouteHint.textContent = config.hint;
      document.querySelectorAll("[data-route-mode]").forEach((button) => {
        button.classList.toggle("active", button.dataset.routeMode === nextMode);
      });
    }

    function updateConversationMeta() {
      const conversationText = state.conversationId
        ? `conversation_id: ${state.conversationId}`
        : "conversation_id: 未创建";
      conversationMeta.textContent = conversationText;
      panelConversationMeta.textContent = state.conversationId || "未创建 conversation_id";
      conversationModeMeta.textContent = state.conversationId ? "多轮上下文中" : "单轮待开始";
      messageCountMeta.textContent = String(state.messages.length);
    }

    function renderChatDock() {
      const dockMessages = state.messages.slice(-6);
      chatDock.innerHTML = "";
      if (!dockMessages.length) {
        const empty = document.createElement("div");
        empty.className = "bubble shinobu empty";
        empty.textContent = "准备好了。发送第一条消息时会自动创建 conversation_id，之后继续发送就会走多轮上下文。";
        chatDock.appendChild(empty);
        return;
      }

      dockMessages.forEach((message) => {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${message.role === "user" ? "user" : "shinobu"}`;
        bubble.textContent = message.content;
        chatDock.appendChild(bubble);
      });
    }

    function renderHistory() {
      historyList.innerHTML = "";
      if (!state.messages.length) {
        const bubble = document.createElement("div");
        bubble.className = "history-bubble assistant";
        bubble.textContent = "这里会展示完整历史。首条消息发送后，右侧面板会自动切到多轮会话视图。";
        historyList.appendChild(bubble);
      } else {
        state.messages.forEach((message) => {
          const bubble = document.createElement("div");
          bubble.className = `history-bubble ${message.role === "user" ? "user" : "assistant"}`;
          bubble.textContent = message.content;
          historyList.appendChild(bubble);
        });
      }

      historyList.scrollTop = historyList.scrollHeight;
      renderChatDock();
      updateConversationMeta();
    }

    function setStreamingState(isStreaming, note) {
      state.isStreaming = isStreaming;
      messageInput.disabled = isStreaming;
      panelMessageInput.disabled = isStreaming;
      sendBtn.disabled = isStreaming;
      panelSendBtn.disabled = isStreaming;
      newConversationBtn.disabled = isStreaming;
      streamingBadge.hidden = !isStreaming;
      historyStateChip.textContent = isStreaming ? "SSE 返回中" : "等待消息";
      streamStatus.textContent = note;
      syncIdleUiState();
    }

    function resetConversation(clearMessages = true) {
      state.conversationId = null;
      localStorage.removeItem(storageKeys.conversationId);
      if (clearMessages) {
        state.messages = [];
        renderHistory();
      }
      updateConversationMeta();
    }

    function resetClientState() {
      state.userId = null;
      localStorage.removeItem(storageKeys.demoUser);
      resetConversation(true);
    }

    function appendMessage(message) {
      const exists = state.messages.some((item) => item.id === message.id);
      if (!exists) {
        state.messages.push(message);
      }
      renderHistory();
    }

    function upsertPendingAssistant(delta) {
      if (!state.pendingAssistantId) {
        state.pendingAssistantId = `pending-${Date.now()}`;
        state.messages.push({
          id: state.pendingAssistantId,
          role: "assistant",
          content: "",
          conversation_id: state.conversationId,
          route_mode: state.routeMode,
          created_at: new Date().toISOString()
        });
      }

      const pending = state.messages.find((item) => item.id === state.pendingAssistantId);
      if (pending) {
        pending.content += delta;
      }
      renderHistory();
    }

    function finalizeAssistantMessage(message) {
      if (state.pendingAssistantId) {
        state.messages = state.messages.filter((item) => item.id !== state.pendingAssistantId);
        state.pendingAssistantId = null;
      }
      appendMessage(message);
    }

    async function ensureDemoUser(forceRefresh = false) {
      if (!forceRefresh) {
        const cached = localStorage.getItem(storageKeys.demoUser);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed.userId) {
              state.userId = parsed.userId;
              return parsed.userId;
            }
          } catch (error) {
            localStorage.removeItem(storageKeys.demoUser);
          }
        }
      }

      const payload = {
        email: `demo-${crypto.randomUUID()}@example.com`,
        password: crypto.randomUUID(),
        display_name: "Prototype User"
      };
      const response = await fetch(`${apiBase}/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("创建 demo 用户失败");
      }

      const data = await response.json();
      const cached = { userId: data.id };
      localStorage.setItem(storageKeys.demoUser, JSON.stringify(cached));
      state.userId = data.id;
      return data.id;
    }

    async function loadConversationMessages(conversationId) {
      const response = await fetch(
        `${apiBase}/conversations/${conversationId}/messages?user_id=${encodeURIComponent(state.userId)}`
      );
      if (response.status === 404) {
        resetConversation(true);
        showToast("原有 conversation_id 已失效，已切回新对话状态。");
        return;
      }
      if (!response.ok) {
        throw new Error("加载消息历史失败");
      }
      const messages = await response.json();
      state.messages = messages;
      renderHistory();
    }

    async function bootstrap(retry = true) {
      connectionChip.textContent = "连接中...";
      try {
        await ensureDemoUser();
        updateRouteMode(state.routeMode);
        updateConversationMeta();
        renderHistory();
        syncIdleUiState();
        if (state.conversationId) {
          await loadConversationMessages(state.conversationId);
        }
        connectRealtimeSync();
        connectionChip.textContent = "已连接原型后端";
      } catch (error) {
        if (retry) {
          resetClientState();
          await bootstrap(false);
          return;
        }
        const message = error instanceof Error ? error.message : "初始化失败";
        connectionChip.textContent = `连接失败: ${message}`;
        showToast(message);
      }
    }

    function parseSseEvent(rawEvent) {
      const lines = rawEvent.split("\n");
      let eventName = "message";
      const dataLines = [];

      lines.forEach((line) => {
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim();
        } else if (line.startsWith("data:")) {
          dataLines.push(line.slice(5).trim());
        }
      });

      const payload = dataLines.length ? JSON.parse(dataLines.join("\n")) : {};
      return { eventName, payload };
    }

    async function consumeSse(response) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) {
          break;
        }

        buffer += decoder.decode(value, { stream: true });
        let boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          const rawEvent = buffer.slice(0, boundary).trim();
          buffer = buffer.slice(boundary + 2);
          if (rawEvent) {
            const { eventName, payload } = parseSseEvent(rawEvent);
            handleStreamEvent(eventName, payload);
          }
          boundary = buffer.indexOf("\n\n");
        }
      }
    }

    function handleStreamEvent(eventName, payload) {
      if (eventName === "conversation") {
        state.conversationId = payload.conversation_id;
        localStorage.setItem(storageKeys.conversationId, payload.conversation_id);
        appendMessage(payload.user_message);
        updateConversationMeta();
        setConversationPanelOpen(true);
        return;
      }

      if (eventName === "chunk") {
        upsertPendingAssistant(payload.delta || "");
        return;
      }

      if (eventName === "done") {
        finalizeAssistantMessage(payload.assistant_message);
        updateConversationMeta();
      }
    }

    async function sendMessage(content) {
      const trimmed = content.trim();
      if (!trimmed || state.isStreaming) {
        return;
      }

      if (!state.userId) {
        await ensureDemoUser();
      }

      setStreamingState(true, "Shinobu 正在通过 SSE 流式返回内容...");
      try {
        const response = await fetch(`${apiBase}/messages`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream"
          },
          body: JSON.stringify({
            user_id: state.userId,
            conversation_id: state.conversationId,
            content: trimmed,
            route_mode: state.routeMode
          })
        });

        if (response.status === 404) {
          localStorage.removeItem(storageKeys.demoUser);
          if (state.conversationId) {
            resetConversation(false);
          }
          await ensureDemoUser(true);
          throw new Error("用户或会话已失效，请重新发送一次。");
        }

        if (!response.ok || !response.body) {
          throw new Error("消息接口返回失败");
        }

        messageInput.value = "";
        panelMessageInput.value = "";
        await consumeSse(response);
        showToast("消息已通过 SSE 完成返回。");
      } catch (error) {
        showToast(error.message || "发送失败");
      } finally {
        setStreamingState(false, "空闲中，可以发送新消息。");
      }
    }

    composerForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      await sendMessage(messageInput.value);
    });

    panelSendBtn.addEventListener("click", async () => {
      await sendMessage(panelMessageInput.value);
    });

    panelMessageInput.addEventListener("keydown", async (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        await sendMessage(panelMessageInput.value);
      }
    });

    conversationToggle.addEventListener("click", () => {
      const isOpen = !liveRoom.classList.contains("conversation-open");
      setConversationPanelOpen(isOpen);
    });

    openConversationBtn.addEventListener("click", () => {
      const isOpen = !liveRoom.classList.contains("conversation-open");
      setConversationPanelOpen(isOpen);
    });

    newConversationBtn.addEventListener("click", () => {
      resetConversation(true);
      showToast("已切换到新对话，下一条消息会创建新的 conversation_id。");
    });

    document.querySelectorAll("[data-route-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        updateRouteMode(button.dataset.routeMode);
      });
    });

    window.addEventListener("resize", applyResponsiveLayout);
    applyResponsiveLayout();
    bootstrap();
  </script>
</body>
</html>
