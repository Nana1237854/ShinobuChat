name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shinobuchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shinobuchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SC_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/shinobuchat_test
          SC_JWT_SECRET_KEY: ci-test-secret
          SC_AI_API_KEY: sk-placeholder
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend/shinobu-chat
        run: npm ci

      - name: Build
        working-directory: frontend/shinobu-chat
        run: npm run build
